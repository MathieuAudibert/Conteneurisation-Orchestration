name: promote to github artifactory

on:
  workflow_call:

jobs:
  publish-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: GitHub container registry login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        run: |
          docker build -f backend/Dockerfile -t ghcr.io/mathieuaudibert/conteneurisation-orchestration-backend:latest .
          docker push ghcr.io/mathieuaudibert/conteneurisation-orchestration-backend:latest

  publish-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: GitHub container registry login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        run: |
          docker build -t ghcr.io/mathieuaudibert/conteneurisation-orchestration-frontend:latest ./frontend
          docker push ghcr.io/mathieuaudibert/conteneurisation-orchestration-frontend:latest
  
  publish-documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: GitHub container registry login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push documentation
        run: |
          docker build -f documentation/Dockerfile -t ghcr.io/mathieuaudibert/conteneurisation-orchestration-documentation:latest .
          docker push ghcr.io/mathieuaudibert/conteneurisation-orchestration-documentation:latest