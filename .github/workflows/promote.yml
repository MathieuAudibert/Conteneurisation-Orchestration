name: promote to github artifactory

on:
  workflow_call:

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: GitHub container registry login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push single combined image
        run: |
          docker build -t ghcr.io/mathieuaudibert/conteneurisation-orchestration:latest .
          docker push ghcr.io/mathieuaudibert/conteneurisation-orchestration:latest

  deploy-to-k8s:
    runs-on: ubuntu-latest
    needs: [publish-images]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Create secrets from environment
        run: |
          kubectl create secret generic mongodb-secret \
            --from-literal=username=${{ secrets.MONGO_ADM_USER }} \
            --from-literal=password=${{ secrets.MONGO_ADM_PASSWD }} \
            --from-literal=admin-uri=${{ secrets.ADM_MONGO_URI }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy MongoDB
        run: kubectl apply -f k8s/mongoDB.yml

      - name: Deploy Backend
        run: |
          kubectl apply -f k8s/backend.yml
          kubectl rollout restart deployment/backend
          kubectl rollout status deployment/backend --timeout=5m

      - name: Deploy Frontend
        run: |
          kubectl apply -f k8s/frontend.yml
          kubectl rollout restart deployment/frontend
          kubectl rollout status deployment/frontend --timeout=5m

      - name: Deploy Documentation
        run: |
          kubectl apply -f k8s/documentation.yml
          kubectl rollout restart deployment/documentation
          kubectl rollout status deployment/documentation --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods
          kubectl get services