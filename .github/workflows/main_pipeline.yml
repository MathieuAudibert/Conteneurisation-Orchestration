name: Main pipeline

on: 
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop", "feature/**"]

jobs:
  copilot-review:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/mr.yml
    permissions:
      contents: read
      pull-requests: write
      issues: write
    secrets: inherit

  build-task:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  promote-task:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-task
    uses: ./.github/workflows/promote.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit