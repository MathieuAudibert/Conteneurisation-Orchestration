services:
  mongodb:
    image: mongo:6.0
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_USER: ${MONGO_ADM_USER:-changeme}
      MONGO_PASSWD: ${MONGO_ADM_PASSWD:-changeme}

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: ${ADM_MONGO_URI}
    volumes: 
      - .:/app
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  