[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/var/log/supervisor/supervisord.log
childlogdir=/var/log/supervisor

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_error.log

[program:backend]
command=/usr/local/bin/fastapi dev backend/src/main.py --host 0.0.0.0 --port 8000
directory=/app
user=orchestration_user
autorestart=true
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend_error.log
environment=PATH="/usr/local/bin:%(ENV_PATH)s"

[program:documentation]
command=/usr/local/bin/zensical serve -a 0.0.0.0:7777
directory=/app/documentation
user=orchestration_user
autorestart=true
stdout_logfile=/var/log/supervisor/docs.log
stderr_logfile=/var/log/supervisor/docs_error.log
environment=PATH="/usr/local/bin:%(ENV_PATH)s"