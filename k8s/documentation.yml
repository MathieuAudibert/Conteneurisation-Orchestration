apiVersion: apps/v1
kind: Deployment
metadata:
  name: documentation
  labels:
    app: documentation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: documentation
  template:
    metadata:
      labels:
        app: documentation
    spec:
      containers:
      - name: documentation
        image: ghcr.io/mathieuaudibert/conteneurisation-orchestration-documentation:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: documentation
spec:
  selector:
    app: documentation
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
